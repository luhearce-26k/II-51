<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto</title>
  <link rel="stylesheet" href="estilos.css">
</head>

<body>

  <header>
    <h1 id="main-title" class="title">Plataforma Educativa</h1>
    <h2 class="title">Universidad Central</h2>

    <!-- menu -->
    <nav class="nav-menu">
      <ul class="nav-list">
        <li class="menu-item"><a href="index.html">Inicio</a></li>
        <li class="menu-item"><a href="cursos.html">Cursos</a></li>
        <li class="menu-item"><a href="contacto.html">Contacto</a></li>
        <li class="menu-item"><a href="ayuda.html">Ayuda</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contacto</h1>

    <section>
      <h2>Formulario de contacto</h2>

      <p>
        Complete el siguiente formulario para comunicarse con la Universidad Central.
      </p>

      <form action="#" method="post">

        <div>
          <label for="nombre">Nombre completo:</label>
          <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            required
          >
        </div>

        <div>
          <label for="correo">Correo electrónico:</label>
          <input 
            type="email" 
            id="correo" 
            name="correo" 
            required
          >
        </div>

        <div>
          <label for="asunto">Asunto:</label>
          <input 
            type="text" 
            id="asunto" 
            name="asunto" 
            required
          >
        </div>

        <div>
          <label for="mensaje">Mensaje:</label>
          <textarea 
            id="mensaje" 
            name="mensaje" 
            rows="6" 
            required
          ></textarea>
        </div>

        <button type="submit">Enviar mensaje</button>

      </form>
    </section>
  </main>

</body>
</html>
